name: Test Codex Security

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan Goof
    runs-on: ubuntu-latest

    steps:
      - name: Check out Goof
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Codex Security
        uses: dans-oai/codex-security@codex/merge-security-action
        env:
          OPENAI_API_KEY: ${{ secrets.CODEX_SECURITY_API_KEY }}
        with:
          scope: repository
          mode: standard
          model: gpt-5.6-luna
          effort: low
          fail-on-severity: none
          verbose: "true"
          summary: "true"
          annotations: "true"
          upload-artifacts: "true"
          artifact-name: codex-security-test
