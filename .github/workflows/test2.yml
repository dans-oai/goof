name: Finite scan comparison
run-name: "Scan comparison / ${{ inputs.study_id }}"

on:
  workflow_dispatch:
    inputs:
      study_id:
        type: string
        required: true

permissions:
  contents: read
  actions: write

concurrency:
  group: scan-comparison-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coordinate:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run finite comparison
        env:
          GH_TOKEN: ${{ github.token }}
          STUDY_REPO: ${{ github.repository }}
          STUDY_BRANCH: ${{ github.ref_name }}
          STUDY_HEAD_SHA: ${{ github.sha }}
          STUDY_ID: ${{ inputs.study_id }}
          STUDY_OUTPUT: ${{ runner.temp }}/study-controller
          STUDY_MODELS_JSON: '["gpt-6-luna","gpt-6-sol","gpt-6-astra"]'
          MAX_TRIALS: '60'
          MAX_ACTIVE: '2'
          LAUNCH_WINDOW_SECONDS: '18000'
          BUDGET_USD: '500'
          BUDGET_HEADROOM_USD: '50'
          PER_SCAN_RESERVE_USD: '30'
        run: python3 .github/scan-study/controller.py
      - name: Preserve complete experiment ledger and downloads
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: study-${{ inputs.study_id }}
          path: ${{ runner.temp }}/study-controller
          if-no-files-found: error
          retention-days: 30
